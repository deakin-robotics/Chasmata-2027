<section class="rover-schematic" aria-label="Rover schematic">
  <svg viewBox="-20 30 360 330" role="img" aria-labelledby="rover-title rover-description">
    <title id="rover-title">Top-down rover schematic</title>
    <desc id="rover-description">
      A symbolic rover with four wheels, a front camera marker, commanded and actual 20-degree
      gimbal arcs, and a telemetry-driven actual arm with a static clamp.
    </desc>

    @if (commandedGimbalYawDeg() !== actualGimbalYawDeg()) {
      <path class="gimbal-direction gimbal-commanded" [attr.d]="commandedGimbalArcPath()" />
    }
    <path class="gimbal-direction gimbal-actual" [attr.d]="actualGimbalArcPath()" />

    <rect
      class="camera camera-front"
      data-camera="front"
      x="149"
      y="78"
      width="22"
      height="10"
      rx="2"
    />
    <path class="front-wheel-direction" d="M83 100V90M79 94l4-4 4 4" />
    <path class="front-wheel-direction" d="M237 100V90M233 94l4-4 4 4" />
    <path class="front-wheel-direction" d="M83 224V214M79 218l4-4 4 4" />
    <path class="front-wheel-direction" d="M237 224V214M233 218l4-4 4 4" />
    <rect class="wheel" data-wheel="front-left" x="67" y="108" width="32" height="58" rx="5" />
    <rect class="wheel" data-wheel="rear-left" x="67" y="232" width="32" height="58" rx="5" />

    <rect class="wheel" data-wheel="front-right" x="221" y="108" width="32" height="58" rx="5" />
    <rect class="wheel" data-wheel="rear-right" x="221" y="232" width="32" height="58" rx="5" />

    <rect class="chassis" x="105" y="88" width="110" height="220" rx="10" />
    <rect class="chassis-detail" x="119" y="104" width="82" height="188" rx="6" />
    <path class="centre-line" d="M160 113V283" />

    @if (actualArmYawDeg() !== null && actualArmLength() !== null) {
      <circle class="arm-pivot" cx="160" cy="165" r="5" />

      <g class="arm arm-actual" [attr.transform]="'rotate(' + actualArmYawDeg() + ' 160 165)'">
        <line
          class="arm-direction"
          x1="160"
          y1="165"
          x2="160"
          [attr.y2]="165 - actualArmLength()!"
        />
        <g [attr.transform]="'translate(0 ' + (85 - actualArmLength()!) + ')'">
          <path class="arm-clamp" d="M151 67L160 80L169 67" />
        </g>
      </g>
    }
  </svg>
</section>
