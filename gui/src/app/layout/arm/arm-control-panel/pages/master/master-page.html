<section class="master-page" aria-label="Arm master controls">
  <app-status-indicator
    label="Gamepad"
    [status]="gamepadStatusLabel()"
    [tone]="gamepadStatusTone()"
  />

  <app-status-indicator
    class="rover-status"
    label="Rover"
    [status]="roverTopologyStatus().label"
    [tone]="roverTopologyStatus().tone"
    [spinner]="roverTopologyStatus().label === 'Lost'"
  />

  <app-status-indicator
    class="base-station-status"
    label="Base Station"
    [status]="baseStationTopologyStatus().label"
    [tone]="baseStationTopologyStatus().tone"
    [spinner]="baseStationTopologyStatus().label === 'Lost'"
  />

  <app-ros-connection-button class="rover-link" />

  <app-control-switch
    class="camera-feed"
    label="Camera Link"
    [checked]="cameraFeedEnabled()"
    [tone]="masterDriveTone"
    (checkedChange)="setCameraFeedEnabled($event)"
  />

  <app-control-flow-connector class="gamepad-stem" variant="vertical" [tone]="gamepadFlowTone()" />

  <app-control-flow-connector class="base-station-stem" variant="vertical" [tone]="baseStationFlowTone()" />

  <app-control-flow-connector class="gamepad-flow" variant="top-right" [tone]="gamepadFlowTone()" />

  <app-control-flow-connector class="base-station-flow" variant="top-left" [tone]="baseStationFlowTone()" />

  <app-control-flow-connector class="rover-flow" variant="vertical" [tone]="roverFlowTone()" />

  <app-control-switch
    label="Master Drive"
    [checked]="masterDriveEnabled()"
    [tone]="masterDriveTone"
    [disabled]="
      !masterDriveEnabled() &&
      (!gamepadConnected() ||
        !rosConnected() ||
        (armMode() === ArmMode.Position && !baseStationAvailable()))
    "
    (checkedChange)="toggleMasterDriveControl($event)"
  />

  <app-two-step-action-button
    class="law-override"
    label="Law Override"
    actionLabel="Override"
    [disabled]="!rosConnected()"
    (activated)="activateLawOverride()"
    (deactivated)="deactivateLawOverride()"
  />

  <app-two-step-action-button
    #clearFaultsButton
    class="clear-faults"
    label="Clear Faults"
    actionLabel="Clear"
    [disabled]="!rosConnected()"
    (activated)="clearArmFaults(clearFaultsButton)"
  />

  <app-control-mode-selector
    class="arm-mode-selector"
    label="Arm control mode"
    [options]="armModeOptions"
    [value]="armMode()"
    [disabled]="!rosConnected() || !baseStationAvailable()"
    (valueChange)="selectArmMode($event)"
  />

</section>
