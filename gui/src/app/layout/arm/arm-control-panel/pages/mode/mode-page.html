<section class="mode-page" aria-label="Arm mode controls">
  <app-control-mode-selector
    label="Arm control mode"
    [options]="armModeOptions"
    [value]="armMode()"
    [disabled]="!rosConnected()"
    (valueChange)="selectArmMode($event)"
  />

  @if (armMode() === 'POSITION') {
    <app-control-mode-selector
      label="Position orientation"
      [options]="orientationModeOptions"
      [value]="orientationMode()"
      [disabled]="!rosConnected() || !canChangeOrientationMode()"
      (valueChange)="selectOrientationMode($event)"
    />
  }
</section>
