<section class="arm-control-panel" aria-label="Arm control panel">
  <nav
    class="control-page-tabs"
    [class.mode-tab-active]="activeTab() === 'mode'"
    role="tablist"
    aria-label="Arm control pages"
  >
    <button
      type="button"
      role="tab"
      class="tab-button"
      [class.active-tab]="activeTab() === 'control'"
      [attr.aria-selected]="activeTab() === 'control'"
      (click)="selectTab('control')"
    >
      Master
    </button>
    <button
      type="button"
      role="tab"
      class="tab-button"
      [class.active-tab]="activeTab() === 'mode'"
      [attr.aria-selected]="activeTab() === 'mode'"
      (click)="selectTab('mode')"
    >
      Mode
    </button>
  </nav>

  @if (activeTab() === 'control') {
    <app-arm-master-page class="tab-content" />
  }

  @if (activeTab() === 'mode') {
    <app-arm-mode-page class="tab-content" />
  }
</section>
