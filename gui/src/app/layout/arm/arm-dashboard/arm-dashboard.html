<main class="arm-dashboard" aria-label="Arm operator dashboard">
  <section class="arm-camera-column" aria-label="Arm rover camera workspace">
    <app-camera-stream
      label="Front camera"
      [url]="frontCameraUrl()"
      (urlChange)="frontCameraUrl.set($event)"
    />

    <app-rover-schematic />

    <app-control-scheme class="control-scheme" context="arm">
      <app-gamepad-control-panel scheme-gamepad />
    </app-control-scheme>
  </section>

  <section class="arm-operator-column" aria-label="Arm operator workspace">
    <app-camera-stream
      class="arm-camera"
      label="Arm camera"
      [url]="armCameraUrl()"
      (urlChange)="armCameraUrl.set($event)"
    />

    <app-camera-stream
      class="gimbal-camera"
      label="Gimbal camera"
      [url]="gimbalCameraUrl()"
      (urlChange)="gimbalCameraUrl.set($event)"
    />
  </section>

  <section class="arm-schematic-column" aria-label="Arm schematic workspace">
    <app-arm-control-panel />
    <app-arm-model-viewer />
  </section>
</main>
