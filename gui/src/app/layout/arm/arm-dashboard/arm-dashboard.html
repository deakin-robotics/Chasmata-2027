<main class="arm-dashboard" aria-label="Arm operator dashboard">
  <section class="rover-camera-column" aria-label="Arm rover camera workspace">
    <app-arm-rover-camera-layout class="rover-camera-layout" />
  </section>

  <section class="arm-operator-column" aria-label="Arm operator workspace">
    <app-camera-stream
      class="arm-camera"
      label="Arm camera"
      [url]="armCameraUrl()"
      (urlChange)="armCameraUrl.set($event)"
    />

    <app-arm-schematic class="arm-schematic" />
  </section>

  <section class="arm-schematic-column" aria-label="Arm schematic workspace">
    <app-arm-control-panel />

    <div class="clamp-schematic-placeholder" aria-label="Clamp schematic">
      <p>Clamp schematic</p>
      <span>End effector placeholder</span>
    </div>
  </section>
</main>
