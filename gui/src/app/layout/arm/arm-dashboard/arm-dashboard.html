<main class="arm-dashboard" aria-label="Arm operator dashboard">
  <section class="arm-camera-column" aria-label="Arm rover and model workspace">
    <app-arm-model-viewer />

    <app-camera-stream
      label="Front camera"
      [source]="frontCamera"
      [allowRoverFallback]="false"
      [enabled]="cameraFeedControl.enabled()"
    />
  </section>

  <section class="arm-operator-column" aria-label="Arm operator workspace">
    <app-camera-stream
      class="arm-camera"
      label="Arm camera"
      [source]="armCamera"
      [allowRoverFallback]="true"
      [enabled]="cameraFeedControl.enabled()"
    />

    <app-camera-stream
      class="gimbal-camera"
      label="Gimbal camera"
      [source]="gimbalCamera"
      [allowRoverFallback]="true"
      [enabled]="cameraFeedControl.enabled()"
    />
  </section>

  <section class="arm-schematic-column" aria-label="Arm controls and reference workspace">
    <app-arm-control-panel />
    <app-rover-schematic />

    <app-control-scheme class="control-scheme" context="arm">
      <app-gamepad-control-panel scheme-gamepad />
    </app-control-scheme>
  </section>
</main>
