<main class="driver-dashboard" aria-label="Driver dashboard">
  <section class="arm-camera-column" aria-label="Driver arm camera workspace">
    <section class="reserved-space" aria-label="Reserved">
      <span>Reserved</span>
    </section>

    <app-camera-stream
      label="Arm camera"
      [source]="armCamera"
      [allowRoverFallback]="false"
      [enabled]="cameraFeedControl.enabled()"
    />
  </section>

  <section class="rover-camera-column" aria-label="Driver rover camera workspace">
    <app-camera-stream
      label="Front camera"
      [source]="frontCamera"
      [allowRoverFallback]="true"
      [enabled]="cameraFeedControl.enabled()"
    />
    <app-camera-stream
      label="Gimbal camera"
      [source]="gimbalCamera"
      [allowRoverFallback]="true"
      [enabled]="cameraFeedControl.enabled()"
    />
  </section>

  <aside class="driver-control-column" aria-label="Driver control panels">
    <app-driver-control-panel />
    <app-rover-schematic />
    <app-control-scheme context="driver">
      <app-gamepad-control-panel scheme-gamepad />
    </app-control-scheme>
  </aside>
</main>
