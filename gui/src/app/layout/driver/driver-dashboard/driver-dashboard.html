<main class="driver-dashboard" aria-label="Driver dashboard">
  <section class="arm-camera-column" aria-label="Driver arm camera workspace">
    <app-camera-stream
      label="Arm camera"
      [url]="armCameraUrl()"
      (urlChange)="armCameraUrl.set($event)"
    />
    <app-rover-schematic />
    <app-control-scheme context="driver">
      <app-gamepad-control-panel scheme-gamepad />
    </app-control-scheme>
  </section>

  <section class="rover-camera-column" aria-label="Driver rover camera workspace">
    <app-camera-stream
      label="Front camera"
      [url]="frontCameraUrl()"
      (urlChange)="frontCameraUrl.set($event)"
    />
    <app-camera-stream
      label="Gimbal camera"
      [url]="gimbalCameraUrl()"
      (urlChange)="gimbalCameraUrl.set($event)"
    />
  </section>

  <aside class="driver-control-column" aria-label="Driver control panels">
    <app-driver-control-panel />
  </aside>
</main>
