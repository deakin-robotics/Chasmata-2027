<section class="sd-page" aria-label="Drive system display">
  <svg class="schematic" viewBox="0 0 800 430" role="img" aria-labelledby="drive-title">
    <title id="drive-title">Drive system schematic</title>

    <rect class="outline" x="225" y="95" width="350" height="212" rx="8" />
    <line class="line" x1="270" y1="194" x2="530" y2="194" />
    <circle class="component" cx="145" cy="145" r="38" />
    <circle class="component" cx="145" cy="257" r="38" />
    <circle class="component" cx="655" cy="145" r="38" />
    <circle class="component" cx="655" cy="257" r="38" />

    <text class="value" x="145" y="147" text-anchor="middle">{{ value('front_left_wheel_joint') }}</text>
    <text class="label" x="145" y="164" text-anchor="middle">rad/s</text>
    <text class="value" x="145" y="259" text-anchor="middle">{{ value('rear_left_wheel_joint') }}</text>
    <text class="label" x="145" y="276" text-anchor="middle">rad/s</text>
    <text class="value" x="655" y="147" text-anchor="middle">{{ value('front_right_wheel_joint') }}</text>
    <text class="label" x="655" y="164" text-anchor="middle">rad/s</text>
    <text class="value" x="655" y="259" text-anchor="middle">{{ value('rear_right_wheel_joint') }}</text>
    <text class="label" x="655" y="276" text-anchor="middle">rad/s</text>
    <text class="small-value" x="145" y="96" text-anchor="middle">CMD {{ value('front_left_wheel_joint', true) }} rad/s</text>
    <text class="small-value" x="145" y="314" text-anchor="middle">CMD {{ value('rear_left_wheel_joint', true) }} rad/s</text>
    <text class="small-value" x="655" y="96" text-anchor="middle">CMD {{ value('front_right_wheel_joint', true) }} rad/s</text>
    <text class="small-value" x="655" y="314" text-anchor="middle">CMD {{ value('rear_right_wheel_joint', true) }} rad/s</text>
    <text class="small-value" x="145" y="78" text-anchor="middle">{{ temperature(0) }}&#176;C<tspan class="small-value-muted"> | </tspan>{{ current(0) }} A</text>
    <text class="small-value" x="145" y="332" text-anchor="middle">{{ temperature(1) }}&#176;C<tspan class="small-value-muted"> | </tspan>{{ current(1) }} A</text>
    <text class="small-value" x="655" y="78" text-anchor="middle">{{ temperature(2) }}&#176;C<tspan class="small-value-muted"> | </tspan>{{ current(2) }} A</text>
    <text class="small-value" x="655" y="332" text-anchor="middle">{{ temperature(3) }}&#176;C<tspan class="small-value-muted"> | </tspan>{{ current(3) }} A</text>
    <text class="value" x="400" y="170" text-anchor="middle">DRIVE</text>
    <text class="value" x="400" y="255" text-anchor="middle"><tspan class="small-value-muted">ODOM X </tspan><tspan>{{ displacement() }} m</tspan></text>

  </svg>
  <p class="telemetry-note">ODOM Y {{ odometryValue('y') }} m | HEADING {{ odometryValue('heading') }} deg | TURN RATE {{ odometryValue('angularSpeed') }} rad/s<br>Wheel telemetry · temperature and current shown as raw values</p>
</section>
