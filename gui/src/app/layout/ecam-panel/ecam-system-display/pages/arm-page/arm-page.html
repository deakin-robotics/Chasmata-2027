<section class="sd-page" aria-label="Arm system display">
  <svg class="schematic" viewBox="0 0 800 550" role="img" aria-labelledby="arm-title">
    <title id="arm-title">Arm system schematic</title>

    <rect class="outline" x="105" y="300" width="120" height="42" rx="5" />
    <text class="label" x="165" y="326" text-anchor="middle">BASE</text>
    <path class="line" d="M165 300 L270 226 L405 253 L505 150 L650 115" />
    <circle class="component" cx="165" cy="300" r="12" />
    <circle class="component" cx="270" cy="226" r="12" />
    <circle class="component" cx="405" cy="253" r="12" />
    <circle class="component" cx="505" cy="150" r="12" />
    <circle class="component" cx="650" cy="115" r="12" />

    <text class="value" x="150" y="260" text-anchor="middle">J1 {{ value('base_joint') }}&#176;</text>
    <text class="small-value" x="150" y="275" text-anchor="middle">V {{ value('base_joint', true) }} &#176;/s CMD {{ command('base_joint') }}</text>
    <text class="value" x="270" y="180" text-anchor="middle">J2 {{ value('shoulder_joint') }}&#176;</text>
    <text class="small-value" x="270" y="195" text-anchor="middle">V {{ value('shoulder_joint', true) }} &#176;/s CMD {{ command('shoulder_joint') }}</text>
    <text class="value" x="405" y="205" text-anchor="middle">J3 {{ value('elbow_joint') }}&#176;</text>
    <text class="small-value" x="405" y="220" text-anchor="middle">V {{ value('elbow_joint', true) }} &#176;/s CMD {{ command('elbow_joint') }}</text>
    <text class="value" x="505" y="100" text-anchor="middle">J4 {{ value('yaw_joint') }}&#176;</text>
    <text class="small-value" x="505" y="115" text-anchor="middle">V {{ value('yaw_joint', true) }} &#176;/s CMD {{ command('yaw_joint') }}</text>
    <text class="value" x="660" y="62" text-anchor="middle">J5 {{ value('pitch_joint') }}&#176;</text>
    <text class="small-value" x="660" y="77" text-anchor="middle">V {{ value('pitch_joint', true) }} &#176;/s CMD {{ command('pitch_joint') }}</text>

    <text class="value" x="660" y="170" text-anchor="middle">J6 {{ value('roll_joint') }}&#176;</text>
    <text class="small-value" x="660" y="185" text-anchor="middle">V {{ value('roll_joint', true) }} &#176;/s CMD {{ command('roll_joint') }}</text>

    <rect class="outline" x="50" y="470" width="210" height="60" rx="5" />
    <rect class="outline" x="295" y="470" width="210" height="60" rx="5" />
    <rect class="outline" x="540" y="470" width="210" height="60" rx="5" />
    <text class="label" x="155" y="495" text-anchor="middle">MAX MOTOR CURRENT</text>
    <text class="value" x="155" y="518" text-anchor="middle">{{ motorValue('current') }} A</text>
    <text class="label" x="400" y="495" text-anchor="middle">MAX MOTOR TEMP</text>
    <text class="value" x="400" y="518" text-anchor="middle">{{ motorValue('temperature') }} °C</text>
    <text class="label" x="645" y="495" text-anchor="middle">PLANNER</text>
    <text class="value" x="645" y="518" text-anchor="middle">{{ planner() ?? '--' }}</text>
  </svg>
  <div class="telemetry-note" aria-label="Arm motor readings">
    @for (joint of ['base_joint', 'shoulder_joint', 'elbow_joint', 'yaw_joint', 'pitch_joint', 'roll_joint']; track joint; let i = $index) {
      <div>J{{ i + 1 }} {{ motorReadout(joint) }}</div>
    }
  </div>
</section>
