<section class="sd-page" aria-label="Camera system display">
  <svg class="schematic" viewBox="0 0 800 500" role="img" aria-labelledby="camera-title">
    <title id="camera-title">Camera system mock schematic</title>

    <rect class="outline" x="150" y="95" width="205" height="95" rx="5" />
    <rect class="outline" x="445" y="95" width="205" height="95" rx="5" />
    <text class="label" x="252" y="120" text-anchor="middle">FRONT CAMERA</text>
    <text class="value" x="252" y="143" text-anchor="middle">NORMAL</text>
    <text class="small-value" x="252" y="164" text-anchor="middle"><tspan class="small-value-muted">STREAM </tspan><tspan>OK</tspan><tspan class="small-value-muted"> · RECON </tspan><tspan>READY</tspan></text>
    <text class="small-value" x="252" y="183" text-anchor="middle"><tspan class="small-value-muted">LAT </tspan><tspan>-- ms</tspan></text>
    <text class="label" x="547" y="120" text-anchor="middle">ARM CAMERA</text>
    <text class="value" x="547" y="143" text-anchor="middle">NORMAL</text>
    <text class="small-value" x="547" y="164" text-anchor="middle"><tspan class="small-value-muted">STREAM </tspan><tspan>OK</tspan><tspan class="small-value-muted"> · RECON </tspan><tspan>READY</tspan></text>
    <text class="small-value" x="547" y="183" text-anchor="middle"><tspan class="small-value-muted">LAT </tspan><tspan>-- ms</tspan></text>

    <line class="line" x1="115" y1="210" x2="685" y2="210" />
    <rect class="outline" x="285" y="225" width="230" height="95" rx="5" />
    <text class="label" x="400" y="249" text-anchor="middle">GIMBAL CAMERA</text>
    <text class="value" x="400" y="272" text-anchor="middle">NORMAL</text>
    <text class="small-value" x="400" y="293" text-anchor="middle"><tspan class="small-value-muted">STREAM </tspan><tspan>OK</tspan><tspan class="small-value-muted"> · RECON </tspan><tspan>READY</tspan></text>
    <text class="small-value" x="400" y="312" text-anchor="middle"><tspan class="small-value-muted">LAT </tspan><tspan>-- ms</tspan></text>
    <g transform="translate(0 30)">
    <rect class="outline" x="115" y="315" width="245" height="145" rx="5" />
    <rect class="outline" x="440" y="315" width="245" height="145" rx="5" />
    <circle class="outline" cx="237" cy="400" r="50" />
    <g [attr.transform]="'rotate(-' + mockPanAngle + ' 237 400)'">
      <line class="line normal" x1="190" y1="400" x2="215" y2="400" />
      <line class="line normal" x1="259" y1="400" x2="284" y2="400" />
      <path class="line normal" d="M277 395 L284 400 L277 405" />
    </g>
    <text class="label" x="237" y="337" text-anchor="middle">LATERAL · PAN</text>
    <text class="value" x="237" y="405" text-anchor="middle">{{ mockPanAngle }} °</text>
    <path class="outline" d="M563 360 A45 45 0 0 1 563 450" />
    <g [attr.transform]="'rotate(-' + mockTiltAngle + ' 563 405)'">
      <line class="line normal" x1="563" y1="405" x2="605" y2="405" />
      <path class="line normal" d="M598 400 L605 405 L598 410" />
    </g>
    <text class="label" x="563" y="337" text-anchor="middle">VERTICAL · TILT</text>
    <text class="value" x="525" y="409" text-anchor="middle">{{ mockTiltAngle }} °</text>
    </g>
  </svg>
  <p class="telemetry-note">Mock telemetry · live CAMERA contract pending</p>
</section>
