<section class="fma" aria-label="Flight Mode Annunciator">
  @for (column of columns(); track column.label) {
    <div class="fma-column">
      <h2>{{ column.label }}</h2>
      <span class="mode mode-active" [class.mode-managed]="column.confirmed === 'MANAGED'">
        {{ column.confirmed }}
      </span>
      <span
        class="mode mode-commanded"
        [class.mode-managed]="column.commanded === 'MANAGED'"
        [class.mode-placeholder]="!column.commanded"
        [attr.aria-hidden]="!column.commanded"
      >
        {{ column.commanded ?? '' }}
      </span>
    </div>
  }
</section>
