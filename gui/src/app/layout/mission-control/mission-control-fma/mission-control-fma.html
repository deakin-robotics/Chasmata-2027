<section class="fma" aria-label="Flight Mode Annunciator">
  @for (column of columns; track column.label) {
    <div class="fma-column">
      <h2>{{ column.label }}</h2>
      <span class="mode mode-active" [class.mode-managed]="column.active === 'MANAGED'">
        {{ column.active }}
      </span>
      <span class="mode mode-armed" [class.mode-managed]="column.armed === 'MANAGED'">
        {{ column.armed }}
      </span>
    </div>
  }
</section>
