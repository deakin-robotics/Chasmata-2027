<div class="mission-control-shell">
  <header class="top-bar">
    <div class="brand" aria-label="Deakin Rover Mission Control">
      <div class="brand-mark" aria-hidden="true">DCR</div>
      <div>
        <p>Deakin Rover</p>
        <h1>Mission Control</h1>
      </div>
    </div>

    <nav class="operator-navigation" aria-label="Operator views">
      <a matButton routerLink="/pilot" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon aria-hidden="true">sports_esports</mat-icon>
        Pilot
      </a>
      <a matButton routerLink="/ecam" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon aria-hidden="true">warning_amber</mat-icon>
        ECAM
      </a>
      <a matButton routerLink="/arm" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon aria-hidden="true">precision_manufacturing</mat-icon>
        Arm
      </a>
    </nav>

    <div class="global-actions">
      <button
        matButton="outlined"
        type="button"
        class="connection-trigger"
        [attr.data-status]="rosConnection.status()"
        [attr.aria-expanded]="connectionPanelOpen()"
        aria-controls="connection-panel"
        (click)="toggleConnectionPanel()"
      >
        <mat-icon
          aria-hidden="true"
          [class.spinning]="rosConnection.isConnecting()"
        >{{ connectionIcon() }}</mat-icon>
        <span>{{ connectionLabel() }}</span>
      </button>

      <button
        matButton="outlined"
        type="button"
        class="estop-placeholder"
        disabled
        matTooltip="Emergency stop is not implemented yet"
      >
        <mat-icon aria-hidden="true">emergency</mat-icon>
        E-stop
      </button>
    </div>
  </header>

  <main id="main-content" class="workspace">
    <router-outlet />
  </main>

  @if (connectionPanelOpen()) {
    <button
      type="button"
      class="panel-backdrop"
      aria-label="Close connection settings"
      (click)="closeConnectionPanel()"
    ></button>

    <aside id="connection-panel" class="connection-panel" aria-label="ROS connection settings">
      <div class="panel-heading">
        <div>
          <p>System</p>
          <h2>Connection settings</h2>
        </div>
        <button
          matIconButton
          type="button"
          aria-label="Close connection settings"
          (click)="closeConnectionPanel()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <app-connection-manager />
    </aside>
  }
</div>
