services:
  discovery:
    build: {context: ../.., dockerfile: rover/rover_mode_switch/Dockerfile}
    network_mode: host
    ipc: host
    command: ["source /opt/ros/jazzy/setup.bash && exec fastdds discovery -i 0 -l 0.0.0.0 -p 11811"]

  rover-dev:
    profiles: [dev]
    build: {context: ../.., dockerfile: rover/rover_mode_switch/Dockerfile}
    network_mode: host
    ipc: host
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}", ROS_LOCALHOST_ONLY: "0", RMW_IMPLEMENTATION: rmw_fastrtps_cpp, ROS_DISCOVERY_SERVER: "127.0.0.1:11811"}
    depends_on: [discovery]

  rover-prod:
    profiles: [prod]
    build: {context: ../.., dockerfile: rover/rover_mode_switch/Dockerfile}
    network_mode: host
    ipc: host
    command: ["source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 launch rover_mode_switch rover.launch.xml mode:=prod"]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}", ROS_LOCALHOST_ONLY: "0", RMW_IMPLEMENTATION: rmw_fastrtps_cpp, ROS_DISCOVERY_SERVER: "127.0.0.1:11811"}
    depends_on: [discovery]
