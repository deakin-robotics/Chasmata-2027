services:
  discovery:
    build:
      context: ../..
      dockerfile: rover/rover/Dockerfile
    network_mode: host
    ipc: host
    command:
      - source /opt/ros/jazzy/setup.bash && exec fastdds discovery -i 0 -l 0.0.0.0 -p 11811
    restart: unless-stopped

  rover:
    build:
      context: ../..
      dockerfile: rover/rover/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "127.0.0.1:11811"
    depends_on: [discovery]
    restart: unless-stopped

  prod:
    profiles: [prod]
    build:
      context: ../..
      dockerfile: rover/rover/Dockerfile.prod
    network_mode: host
    ipc: host
    environment:
      ARM_BACKEND: "${ARM_BACKEND:-real}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "127.0.0.1:11811"
    volumes:
      - type: bind
        source: ../control/drivetrain/rover_drivetrain_control/config
        target: /etc/rover/drivetrain
        read_only: true
      - type: bind
        source: ../control/arm/config
        target: /etc/rover/arm
        read_only: true
      - /dev:/dev
    device_cgroup_rules:
      - 'c 166:* rwm'
      - 'c 188:* rwm'
    depends_on: [discovery]
    restart: "no"

  media-source:
    build:
      context: .
      dockerfile: Dockerfile.media-source
    entrypoint: ["/bin/sh", "/run-test-sources.sh"]
    environment:
      BASE_STATION_MEDIA_HOST: "${BASE_STATION_MEDIA_HOST:-media-gateway}"
      MEDIA_WIDTH: "${MEDIA_WIDTH:-1280}"
      MEDIA_HEIGHT: "${MEDIA_HEIGHT:-720}"
      MEDIA_FPS: "${MEDIA_FPS:-30}"
      MEDIA_BITRATE_KBPS: "${MEDIA_BITRATE_KBPS:-2500}"
      MEDIA_BUFFER_KBPS: "${MEDIA_BUFFER_KBPS:-5000}"
      MEDIA_KEYFRAME_INTERVAL: "${MEDIA_KEYFRAME_INTERVAL:-30}"
    volumes: ["./run-test-sources.sh:/run-test-sources.sh:ro"]
    networks: {local-media: {}}
    restart: unless-stopped

networks:
  default: {}
  local-media:
    name: chasmata-local-media
    external: true
