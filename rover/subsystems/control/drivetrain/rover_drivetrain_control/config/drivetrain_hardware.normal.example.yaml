# Illustrative normal-profile configuration. Replace device, motor, geometry,
# and timing values with the values for the drivetrain; timings are not measurements.
serial_device: /dev/ttyACM0
baud_rate: 38400
parity: 'N'
data_bits: 8
stop_bits: 1
response_timeout_ms: 10
update_hz: 15
upstream_timeout_ms: 110
stop_deadline_ms: 300
measured_stop_wire_budget_ms: 48  # illustrative, not measured
measured_worst_bus_cycle_ms: 61   # illustrative, not measured
late_trigger_ms: 100
fl_id: 1
rl_id: 2
fr_id: 3
rr_id: 4
gear_ratio: 50          # placeholder from bench example
motor_rpm_limit: 2000   # placeholder from bench example
wheel_radius: 0.1       # placeholder, metres
wheel_separation: 0.5   # placeholder, metres
bench_motion_enabled: false
pole_pairs: 2           # placeholder from bench example
bench_rpm_cap: 300      # unused in normal profile
bench_stop_deadline_ms: 1500  # unused in normal profile
