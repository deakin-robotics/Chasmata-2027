controller_manager:
  ros__parameters:
    update_rate: 50  # Control loop frequency (50 Hz)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_real_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Joint state broadcaster is remapped to /arm/joint_states in arm_control.launch.py
joint_state_broadcaster:
  ros__parameters:
    interfaces:
      - position
      - velocity

# Joint trajectory controller: receives trajectory commands from MoveIt2
arm_real_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - yaw_joint
      - pitch_joint
      - roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    action_monitor_rate: 10.0
    allow_integration_in_goal_trajectories: true
    constraints:
      base_joint: {trajectory: 0.15, goal: 0.02}
      shoulder_joint: {trajectory: 0.15, goal: 0.02}
      elbow_joint: {trajectory: 0.15, goal: 0.02}
      yaw_joint: {trajectory: 0.15, goal: 0.02}
      pitch_joint: {trajectory: 0.15, goal: 0.02}
      roll_joint: {trajectory: 0.15, goal: 0.02}
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
    gains:
      base_joint: { p: 100.0, i: 0.01, d: 5.0 }
      shoulder_joint: { p: 100.0, i: 0.01, d: 5.0 }
      elbow_joint: { p: 100.0, i: 0.01, d: 5.0 }
      yaw_joint: { p: 100.0, i: 0.01, d: 5.0 }
      pitch_joint: { p: 100.0, i: 0.01, d: 5.0 }
      roll_joint: { p: 100.0, i: 0.01, d: 5.0 }
