# Bench configuration used on 12 November 2026. Copy this file and verify the
# hardware and timing values for the actual rover before enabling bench motion.
# With bench motion disabled, this example is not a production configuration.
serial_device: /dev/ttyACM0  # CH343 USB-to-RS485 adapter; device name may differ
baud_rate: 9600
parity: 'N'
data_bits: 8
stop_bits: 1
response_timeout_ms: 100
update_hz: 2       # integer: also used as the ros2_control rw_rate attribute
upstream_timeout_ms: 110
stop_deadline_ms: 300
measured_stop_wire_budget_ms: 250  # bench value; verify against measured stop ACKs
measured_worst_bus_cycle_ms: 245   # bench value; verify the full shared-bus cycle
late_trigger_ms: 750
fl_id: 1           # slave-to-wheel mapping: confirm with Forrest
rl_id: 2
fr_id: 3
rr_id: 4
gear_ratio: 50          # PLACEHOLDER
motor_rpm_limit: 2000   # PLACEHOLDER
wheel_radius: 0.1       # PLACEHOLDER: metres
wheel_separation: 0.5   # PLACEHOLDER: metres

# --- Bench motion test only (see README "Bench motion test") -----------------
# Off by default. Set true or false; anything else makes the plugin refuse to start.
bench_motion_enabled: false
# The values below are read only when bench_motion_enabled is true.
pole_pairs: 2                 # verify against the connected motors
bench_rpm_cap: 300            # motor RPM; at most 500
bench_stop_deadline_ms: 1500  # bench budget, not a measured physical stop time
