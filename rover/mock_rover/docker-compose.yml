services:
  discovery:
    build:
      context: ../..
      dockerfile: rover/mock_rover/Dockerfile
    network_mode: host
    ipc: host
    command:
      - source /opt/ros/jazzy/setup.bash && exec fastdds discovery -i 0 -l 0.0.0.0 -p 11811
    restart: unless-stopped

  mock-rover:
    build:
      context: ../..
      dockerfile: rover/mock_rover/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "127.0.0.1:11811"
    depends_on: [discovery]
    restart: unless-stopped

  prod:
    profiles: [prod]
    build:
      context: ../..
      dockerfile: rover/mock_rover/Dockerfile.prod
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "127.0.0.1:11811"
      DRIVE_MAX_WHEEL_SPEED: "${DRIVE_MAX_WHEEL_SPEED:-}"
      DRIVE_HARDWARE_CONFIG: "${DRIVE_HARDWARE_CONFIG:-}"
      DRIVE_SERIAL_DEVICE: "${DRIVE_SERIAL_DEVICE:-}"
    volumes:
      - type: bind
        source: "${DRIVE_HARDWARE_CONFIG:-../control/drivetrain/rover_drivetrain_control/config/drivetrain_hardware.example.yaml}"
        target: /etc/rover/drivetrain-hardware.yaml
        read_only: true
        bind:
          create_host_path: false
    devices:
      - "${DRIVE_SERIAL_DEVICE:-/dev/null}:${DRIVE_SERIAL_DEVICE:-/dev/null}"
    depends_on: [discovery]
    restart: "no"

  media-source:
    build:
      context: .
      dockerfile: Dockerfile.media-source
    entrypoint: ["/bin/sh", "/run-test-sources.sh"]
    environment:
      BASE_STATION_MEDIA_HOST: "${BASE_STATION_MEDIA_HOST:-media-gateway}"
      MEDIA_WIDTH: "${MEDIA_WIDTH:-1280}"
      MEDIA_HEIGHT: "${MEDIA_HEIGHT:-720}"
      MEDIA_FPS: "${MEDIA_FPS:-30}"
      MEDIA_BITRATE_KBPS: "${MEDIA_BITRATE_KBPS:-2500}"
      MEDIA_BUFFER_KBPS: "${MEDIA_BUFFER_KBPS:-5000}"
      MEDIA_KEYFRAME_INTERVAL: "${MEDIA_KEYFRAME_INTERVAL:-30}"
    volumes: ["./run-test-sources.sh:/run-test-sources.sh:ro"]
    networks: {local-media: {}}
    restart: unless-stopped

networks:
  default: {}
  local-media:
    name: chasmata-local-media
    external: true
