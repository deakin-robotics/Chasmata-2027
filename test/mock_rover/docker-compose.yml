services:
  discovery:
    build: .
    command:
      - source /opt/ros/jazzy/setup.bash && exec fastdds discovery -i 0 -l 0.0.0.0 -p 11811
    ports:
      - '${ROS_DISCOVERY_PORT:-11811}:11811/udp'
    networks:
      - local-ros
    restart: unless-stopped

  mock-rover:
    build: .
    environment:
      ROS_DOMAIN_ID: '${ROS_DOMAIN_ID:-0}'
      ROS_LOCALHOST_ONLY: '0'
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: 'discovery:11811'
    ports:
      - '9090:9090'
    networks:
      - local-ros
    depends_on:
      - discovery
    restart: unless-stopped

  media-source:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    entrypoint: ['/bin/sh', '/run-test-sources.sh']
    environment:
      MEDIA_GATEWAY_HOST: '${MEDIA_GATEWAY_HOST:-host.docker.internal}'
      MEDIA_GATEWAY_RTSP_PORT: '${MEDIA_GATEWAY_RTSP_PORT:-8554}'
      MEDIA_WIDTH: '${MEDIA_WIDTH:-1280}'
      MEDIA_HEIGHT: '${MEDIA_HEIGHT:-720}'
      MEDIA_FPS: '${MEDIA_FPS:-30}'
      MEDIA_BITRATE_KBPS: '${MEDIA_BITRATE_KBPS:-2500}'
      MEDIA_BUFFER_KBPS: '${MEDIA_BUFFER_KBPS:-5000}'
      MEDIA_KEYFRAME_INTERVAL: '${MEDIA_KEYFRAME_INTERVAL:-30}'
    volumes:
      - ./run-test-sources.sh:/run-test-sources.sh:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

networks:
  local-ros:
    name: chasmata-local-ros
