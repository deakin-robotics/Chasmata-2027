logLevel: info

rtsp: false
rtspTransports: [tcp]
rtspAddress: :8554

webrtc: true
webrtcEncryption: false
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
# Local development overrides this permissive trusted-LAN setting through Compose.
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: ["localhost", "127.0.0.1"]

# Internal API used by the read-only camera-health service.
api: true
apiAddress: 127.0.0.1:9997

paths:
  front:
    source: publisher
    rtspTransport: tcp
  gimbal:
    source: publisher
    rtspTransport: tcp
  arm:
    source: publisher
    rtspTransport: tcp
