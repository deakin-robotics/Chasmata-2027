services:
  mock-rover:
    build:
      context: ../test/mock_rover
    environment:
      ROS_DOMAIN_ID: '0'
      ROS_LOCALHOST_ONLY: '0'
    ports:
      - '${MOVEIT2_ROSBRIDGE_PORT:-19090}:9090'
    networks:
      - rover-test

  media-gateway:
    image: bluenviron/mediamtx:1.21.1
    volumes:
      - ../test/media_gateway/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - '${MOVEIT2_WEBRTC_PORT:-8889}:8889'
      - '${MOVEIT2_WEBRTC_UDP_PORT:-8189}:8189/udp'
      - '${MOVEIT2_MEDIA_API_PORT:-9997}:9997'
    networks:
      - rover-test

  media-source:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    entrypoint: ['/bin/sh', '/run-test-sources.sh']
    environment:
      MEDIA_WIDTH: '${MEDIA_WIDTH:-1280}'
      MEDIA_HEIGHT: '${MEDIA_HEIGHT:-720}'
      MEDIA_FPS: '${MEDIA_FPS:-30}'
      MEDIA_BITRATE_KBPS: '${MEDIA_BITRATE_KBPS:-2500}'
      MEDIA_BUFFER_KBPS: '${MEDIA_BUFFER_KBPS:-5000}'
      MEDIA_KEYFRAME_INTERVAL: '${MEDIA_KEYFRAME_INTERVAL:-30}'
    volumes:
      - ../test/media_gateway/run-test-sources.sh:/run-test-sources.sh:ro
    depends_on:
      - media-gateway
    networks:
      - rover-test

  moveit2:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    depends_on:
      - mock-rover
    environment:
      ROS_DOMAIN_ID: '0'
      ROS_LOCALHOST_ONLY: '0'
    networks:
      - rover-test

networks:
  rover-test:
    driver: bridge
