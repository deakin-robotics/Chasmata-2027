services:
  media-gateway:
    image: bluenviron/mediamtx:1.21.1
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${BASESTATION_LAN_IP:-192.168.1.10}"
      MTX_WEBRTCALLOWORIGINS: "http://basestation.local,http://${BASESTATION_LAN_IP:-192.168.1.10}"
      MTX_PATHS_FRONT_SOURCE: "rtsp://${ROVER_HOST:-192.168.1.20}:8554/front"
      MTX_PATHS_GIMBAL_SOURCE: "rtsp://${ROVER_HOST:-192.168.1.20}:8554/gimbal"
      MTX_PATHS_ARM_SOURCE: "rtsp://${ROVER_HOST:-192.168.1.20}:8554/arm"
      MTX_AUTHINTERNALUSERS_2_USER: any
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: api
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8889:8889"
      - "8189:8189/udp"
    restart: unless-stopped

  camera-health:
    build: ./camera-health
    environment:
      MEDIAMTX_API_URL: http://media-gateway:9997/v3/paths/list
      CAMERA_HEALTH_ALLOWED_ORIGINS: "http://basestation.local,http://${BASESTATION_LAN_IP:-192.168.1.10}"
    ports:
      - "127.0.0.1:9998:9998"
    depends_on:
      - media-gateway
    restart: unless-stopped

  operations-web:
    build:
      context: ..
      dockerfile: basestation/operations-web/Dockerfile
    network_mode: host
    environment:
      ROVER_HOST: "${ROVER_HOST:-192.168.1.20}"
    depends_on:
      - media-gateway
      - camera-health
      - rosbridge
    restart: unless-stopped

  moveit2:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "${ROVER_HOST:-192.168.1.20}:11811"

  rosbridge:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    network_mode: host
    ipc: host
    command:
      - source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run rosbridge_server rosbridge_websocket --ros-args -p port:=9091
    environment:
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "${ROVER_HOST:-192.168.1.20}:11811"
    restart: unless-stopped

  ecam-alert-aggregator:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    network_mode: host
    ipc: host
    command:
      - source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 launch ecam_alerts ecam_alert_aggregator.launch.py role:=basestation
    environment:
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "${ROVER_HOST:-192.168.1.20}:11811"
    restart: unless-stopped
