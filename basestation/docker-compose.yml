services:
  media-gateway:
    image: bluenviron/mediamtx:1.21.1
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIA_WEBRTC_ADDITIONAL_HOSTS:-localhost,127.0.0.1}"
      MTX_WEBRTCALLOWORIGINS: "${MEDIA_WEBRTC_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}"
      MTX_PATHS_FRONT_SOURCE: "rtsp://${ROVER_RTSP_HOST:-192.168.1.20}:${ROVER_RTSP_PORT:-8554}/front"
      MTX_PATHS_GIMBAL_SOURCE: "rtsp://${ROVER_RTSP_HOST:-192.168.1.20}:${ROVER_RTSP_PORT:-8554}/gimbal"
      MTX_PATHS_ARM_SOURCE: "rtsp://${ROVER_RTSP_HOST:-192.168.1.20}:${ROVER_RTSP_PORT:-8554}/arm"
      MTX_AUTHINTERNALUSERS_2_USER: camera-health
      MTX_AUTHINTERNALUSERS_2_PASS: "${CAMERA_HEALTH_API_PASSWORD:-local-camera-health}"
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: api
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIA_WEBRTC_PORT:-8889}:8889"
      - "${MEDIA_WEBRTC_UDP_PORT:-8189}:8189/udp"
    restart: unless-stopped

  camera-health:
    build: ./camera-health
    environment:
      MEDIAMTX_API_URL: http://media-gateway:9997/v3/paths/list
      MEDIAMTX_API_USER: camera-health
      MEDIAMTX_API_PASSWORD: "${CAMERA_HEALTH_API_PASSWORD:-local-camera-health}"
      CAMERA_HEALTH_ALLOWED_ORIGINS: "${MEDIA_WEBRTC_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}"
    ports:
      - "${CAMERA_HEALTH_PORT:-9998}:9998"
    depends_on:
      - media-gateway
    restart: unless-stopped

  moveit2:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: "${ROVER_DISCOVERY_SERVER:-rover.local:11811}"
