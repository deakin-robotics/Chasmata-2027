services:
  camera-health:
    extends:
      file: docker-compose.yml
      service: camera-health
    environment:
      MEDIAMTX_API_URL: http://media-gateway:9997/v3/paths/list
      MEDIAMTX_API_USER: camera-health
      MEDIAMTX_API_PASSWORD: "${CAMERA_HEALTH_API_PASSWORD:-local-camera-health}"
      CAMERA_HEALTH_ALLOWED_ORIGINS: 'http://localhost:4200,http://127.0.0.1:4200'

  media-gateway:
    extends:
      file: docker-compose.yml
      service: media-gateway
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "localhost,127.0.0.1"
      MTX_WEBRTCALLOWORIGINS: "http://localhost:4200,http://127.0.0.1:4200"
      MTX_PATHS_FRONT_SOURCE: rtsp://rover-media-gateway:8554/front
      MTX_PATHS_GIMBAL_SOURCE: rtsp://rover-media-gateway:8554/gimbal
      MTX_PATHS_ARM_SOURCE: rtsp://rover-media-gateway:8554/arm
    networks:
      default: {}
      local-media: {}

  moveit2:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    network_mode: host
    environment:
      ROS_DISCOVERY_SERVER: 127.0.0.1:11811
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp

networks:
  default: {}
  local-media:
    name: chasmata-local-media
    external: true
