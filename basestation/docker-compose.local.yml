services:
  camera-health:
    build: ./camera-health
    environment:
      MEDIAMTX_API_URL: http://media-gateway:9997/v3/paths/list
      CAMERA_HEALTH_ALLOWED_ORIGINS: 'http://localhost:4200,http://127.0.0.1:4200'
    ports:
      - "9998:9998"
    depends_on:
      - media-gateway
    restart: unless-stopped

  media-gateway:
    image: bluenviron/mediamtx:1.21.1
    environment:
      MTX_APIADDRESS: ":9997"
      MTX_WEBRTCADDITIONALHOSTS: "localhost,127.0.0.1"
      MTX_WEBRTCALLOWORIGINS: "http://localhost:4200,http://127.0.0.1:4200"
      MTX_AUTHINTERNALUSERS_2_USER: any
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: api
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8889:8889"
      - "8189:8189/udp"
    restart: unless-stopped
    networks:
      default: {}
      local-media: {}

  moveit2:
    build:
      context: ..
      dockerfile: basestation/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_DISCOVERY_SERVER: 127.0.0.1:11811
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp

  rosbridge:
    extends:
      file: docker-compose.yml
      service: rosbridge
    environment:
      ROS_DISCOVERY_SERVER: 127.0.0.1:11811
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp

  ecam-alert-aggregator:
    extends:
      file: docker-compose.yml
      service: ecam-alert-aggregator
    environment:
      ROS_DISCOVERY_SERVER: 127.0.0.1:11811
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp

networks:
  default: {}
  local-media:
    name: chasmata-local-media
    external: true
